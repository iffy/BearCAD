[package]
name = "bearcad"
version = "0.1.0"
edition = "2021"
description = "BearCAD — on-device parametric CAD (early prototype)"
repository = "https://github.com/iffy/BearCAD"
license = "MIT OR Apache-2.0"

[[bin]]
name = "bearcad"
path = "src/main.rs"

[build-dependencies]
ico = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
winres = "0.1"
# Compiles the C++ FFI shim (cpp/bearcad_kernel.cpp) only when the `occt` feature
# is on; unused otherwise. Small, so kept as an unconditional build-dep.
cc = "1"

[dev-dependencies]
# The WGSL in `src/gpu_viewport/shader.wgsl` is only compiled when a GPU device exists, which
# never happens in the test suite — a typo in it would ship. naga is wgpu's own shader
# front-end and is already in the tree; parsing + validating the file in a test catches it
# (#1073).
naga = { version = "29", features = ["wgsl-in"] }

[dependencies]
# wgpu, eframe and friends report through the `log` crate — surface acquisition failures,
# lost or outdated swapchains, reconfigurations. Nothing installed a logger, so all of that
# was dropped; `diag::install_log_bridge` now forwards it into the diagnostics file (#1032).
log = "0.4"
# Pre-validates font faces before they're handed to egui's glyph atlas (#392): egui panics
# on a face it can't parse, so the font-chooser preview only registers faces ab_glyph (the
# same parser egui uses) accepts. Already in the tree via epaint.
ab_glyph = "0.2"
# wgpu backend (Metal on macOS) per SPEC §1; the default glow/OpenGL backend
# crashes with a bus error on some macOS setups.
# `wgpu_no_default_features` (not `wgpu`) so we don't inherit egui-wgpu's
# `wgpu/default` + `wgpu/webgl` — every desktop HAL plus WebGL compiled into
# the native binary. Backends are selected per-OS below.
eframe = { version = "0.35", default-features = false, features = ["wgpu_no_default_features", "default_fonts", "x11", "wayland"] }
egui = "0.35"
# 0.17 skips the Linux-backend check on wasm32 (0.15 required gtk3/xdg-portal).
rfd = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.29", features = ["serde"] }
# Tracing-image import is PNG/JPEG (file picker + script); previews and screenshots
# are PNG. Default image features also pull AVIF/EXR/TIFF/GIF/WebP/QOI encoders.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Text tool (#282): system-font enumeration/selection + TrueType/CFF glyph outline extraction.
# Both are already in the tree transitively via egui/epaint; depended on directly here.
fontdb = "0.22"
ttf-parser = "0.24"
base64 = "0.22"
# Icon SVGs are paths only (no <text>, no embedded rasters). Default resvg/usvg
# features compile rustybuzz + system-font matching + GIF/JPEG/WebP decoders.
resvg = { version = "0.44", default-features = false }
usvg = { version = "0.44", default-features = false }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
bytemuck = { version = "1", features = ["derive"] }

# Native HTTPS (rustls + webpki-roots): AI streaming (#1596) and auto-update (#1610).
# ureq's defaults keep it self-contained — no OpenSSL, no system certificate store, no
# system curl. Native only: the browser build has no AI features and no updater.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ureq]
version = "3.4"

# Native-only: bundled C code (SQLite, Lua) doesn't build for wasm32-unknown-unknown.
# The web build saves/loads the JSON document format instead (storage::to_json_bytes)
# and ships without the Lua scripting runtime.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
# Headless mode (`--headless`, the default for `--script`): blocks on the offscreen
# wgpu adapter/device request the way eframe does for its windowed setup.
pollster = "0.4"
# Linux file dialogs use the desktop portal (rfd's default). macOS/Windows
# use native panels and don't need the portal/wayland crates.
[target.'cfg(target_os = "linux")'.dependencies.rfd]
version = "0.17"
default-features = false
features = ["xdg-portal", "wayland"]

# The McMaster-Carr catalog window (#1022): a platform web view (WKWebView / WebView2 /
# WebKitGTK) in a window of its own, run by the `bearcad mcmaster` subcommand — a second
# process, so its event loop never meets eframe's. `tao` is the windowing wry pairs with,
# and is what initializes GTK on Linux, which is why that platform works here at all.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.wry]
version = "0.56"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tao]
version = "0.36"
default-features = false
# The window handle wry takes (raw-window-handle 0.6), which the default feature set would
# otherwise bring in alongside a lot the catalog window has no use for.
features = ["rwh_06"]

# Bring the McMaster helper (or the main app) to the front by PID so ⌘` can cycle
# between them (#1023). Same multi-process shape; just coordinated activation.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "NSEvent", "NSApplication", "NSWindow", "NSView", "NSResponder", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "libc", "block2"] }
# NSGeometry for NSSize when building Finder custom icons from raw RGBA (#1304).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSGeometry"] }
block2 = "0.6"
# Metal only — Vulkan/DX12/GLES/WebGL never run here but still compiled in
# when wgpu's default features (via egui-wgpu/default) were on.
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
# Keep the macOS resize-jitter workaround that egui-wgpu's default feature set
# used to enable (it just turns on wgpu/metal, already selected above).
egui-wgpu = { version = "0.35", default-features = false, features = ["macos-window-resize-jitter-fix"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "gles", "wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# Install the Lua->app dispatch callback on globalThis (src/web_lua.rs).
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "Response"] }
# std::time::Instant panics on wasm; this is the drop-in replacement.
web-time = "1"
# WebGPU + WebGL fallback. No desktop HALs on wasm.
wgpu = { version = "29", default-features = false, features = ["std", "wgsl", "webgpu", "webgl"] }
console_error_panic_hook = "0.1"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.muda]
version = "0.19"
default-features = false
# Linux/BSD need the gtk backend compiled in; macOS/Windows ignore this feature.
features = ["gtk"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.raw-window-handle]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.winit]
version = "0.30"
default-features = false

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
