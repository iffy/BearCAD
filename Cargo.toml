[package]
name = "bearcad"
version = "0.1.0"
edition = "2021"
description = "BearCAD — on-device parametric CAD (early prototype)"
repository = "https://github.com/iffy/BearCAD"
license = "MIT OR Apache-2.0"

[[bin]]
name = "bearcad"
path = "src/main.rs"

[build-dependencies]
ico = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
winres = "0.1"
# Compiles the C++ FFI shim (cpp/bearcad_kernel.cpp) only when the `occt` feature
# is on; unused otherwise. Small, so kept as an unconditional build-dep.
cc = "1"

[dev-dependencies]
# The WGSL in `src/gpu_viewport/shader.wgsl` is only compiled when a GPU device exists, which
# never happens in the test suite — a typo in it would ship. naga is wgpu's own shader
# front-end and is already in the tree; parsing + validating the file in a test catches it
# (#1073).
naga = { version = "29", features = ["wgsl-in"] }

[dependencies]
# wgpu, eframe and friends report through the `log` crate — surface acquisition failures,
# lost or outdated swapchains, reconfigurations. Nothing installed a logger, so all of that
# was dropped; `diag::install_log_bridge` now forwards it into the diagnostics file (#1032).
log = "0.4"
# Pre-validates font faces before they're handed to egui's glyph atlas (#392): egui panics
# on a face it can't parse, so the font-chooser preview only registers faces ab_glyph (the
# same parser egui uses) accepts. Already in the tree via epaint.
ab_glyph = "0.2"
# wgpu backend (Metal on macOS) per SPEC §1; the default glow/OpenGL backend
# crashes with a bus error on some macOS setups.
eframe = { version = "0.35", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.35"
# eframe's `wgpu` feature only pulls in the `wgpu` crate — it doesn't select a backend.
# That used to come transitively via egui-wgpu's own `default` feature, which we don't
# get since eframe is `default-features = false` above; without it wgpu has no backend
# (metal/vulkan/dx12/gles) compiled in and panics at startup. Depend on `wgpu` directly
# with its own default backends (unifies with eframe's copy via Cargo feature unification).
wgpu = "29"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.29", features = ["serde"] }
image = "0.25"
# Text tool (#282): system-font enumeration/selection + TrueType/CFF glyph outline extraction.
# Both are already in the tree transitively via egui/epaint; depended on directly here.
fontdb = "0.22"
ttf-parser = "0.24"
base64 = "0.22"
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
bytemuck = { version = "1", features = ["derive"] }

# Native-only: bundled C code (SQLite, Lua) doesn't build for wasm32-unknown-unknown.
# The web build saves/loads the JSON document format instead (storage::to_json_bytes)
# and ships without the Lua scripting runtime.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
mlua = { version = "0.10", features = ["lua54", "vendored"] }

# The McMaster-Carr catalog window (#1022): a platform web view (WKWebView / WebView2 /
# WebKitGTK) in a window of its own, run by the `bearcad mcmaster` subcommand — a second
# process, so its event loop never meets eframe's. `tao` is the windowing wry pairs with,
# and is what initializes GTK on Linux, which is why that platform works here at all.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.wry]
version = "0.56"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tao]
version = "0.36"
default-features = false
# The window handle wry takes (raw-window-handle 0.6), which the default feature set would
# otherwise bring in alongside a lot the catalog window has no use for.
features = ["rwh_06"]

# Bring the McMaster helper (or the main app) to the front by PID so ⌘` can cycle
# between them (#1023). Same multi-process shape; just coordinated activation.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "NSEvent", "NSApplication", "NSWindow", "NSView", "NSResponder", "libc", "block2"] }
block2 = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# Install the Lua->app dispatch callback on globalThis (src/web_lua.rs).
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "Response"] }
# std::time::Instant panics on wasm; this is the drop-in replacement.
web-time = "1"
# WebGL fallback so browsers without WebGPU still render.
wgpu = { version = "29", features = ["webgl"] }
console_error_panic_hook = "0.1"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.muda]
version = "0.19"
default-features = false
# Linux/BSD need the gtk backend compiled in; macOS/Windows ignore this feature.
features = ["gtk"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.raw-window-handle]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.winit]
version = "0.30"
default-features = false

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
