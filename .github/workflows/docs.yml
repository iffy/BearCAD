name: Website

on:
  push:
    branches: [master]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
      - "scripts/gen-doc-screenshots.sh"
      - "scripts/select-doc-screenshots.sh"
      - "scripts/build-web.sh"
      - "scripts/build-occt-wasm.sh"
      - "web/**"
      - "cpp/**"
      - "third_party/OCCT"
      - "third_party/solvespace"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "docs-site/screenshots/**"
      - "scripts/gen-doc-screenshots.sh"
      - "scripts/select-doc-screenshots.sh"
      - ".github/workflows/docs.yml"
      - "src/**"
      - "cpp/**"
      - "Cargo.toml"
      - "Cargo.lock"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # The hosted web app (wasm32) deploys under /app/ next to the docs.
  # Skip on pull_request — PRs only validate screenshots.
  webapp:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download web app from latest published release
        id: fetch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-web-release.sh

      - name: Upload web app artifact (from release)
        if: steps.fetch.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: webapp
          path: web/dist/
          if-no-files-found: error

      - name: Install Rust toolchain
        if: steps.fetch.outcome == 'failure'
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        if: steps.fetch.outcome == 'failure'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-web

      - name: Install wasm-bindgen-cli
        if: steps.fetch.outcome == 'failure'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.125

      - name: Install Emscripten
        if: steps.fetch.outcome == 'failure'
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.2

      - name: Cache OCCT wasm build
        if: steps.fetch.outcome == 'failure'
        id: occt-wasm-cache
        uses: actions/cache@v5
        with:
          path: third_party/OCCT/occt-install-wasm
          key: occt-install-wasm-v8.0.0-${{ hashFiles('scripts/build-occt-wasm.sh') }}

      - name: Fetch OCCT submodule (cache miss only)
        if: steps.fetch.outcome == 'failure' && steps.occt-wasm-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 third_party/OCCT

      - name: Fetch solvespace submodule
        if: steps.fetch.outcome == 'failure'
        run: |
          git submodule update --init --depth 1 third_party/solvespace
          git -C third_party/solvespace submodule update --init --depth 1 extlib/eigen extlib/mimalloc

      - name: Build web app (fallback)
        if: steps.fetch.outcome == 'failure'
        run: scripts/build-web.sh

      - name: Upload web app artifact (fallback build)
        if: steps.fetch.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: webapp
          path: web/dist/
          if-no-files-found: error

  # Nightly: builds the app, generates all screenshots, then builds the docs site.
  # Push: fetches screenshots from the deployed site, then builds the docs site.
  build:
    if: github.event_name != 'pull_request'
    needs: webapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # --- Screenshots -----------------------------------------------------------
      - name: Compute screenshot source
        id: source
        run: |
          pages_base="$(GITHUB_REPOSITORY="$GITHUB_REPOSITORY" bash scripts/pages-base.sh)"
          echo "pages_base=$pages_base"
          source="fetch"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            source="build"
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "pages_base=$pages_base" >> "$GITHUB_OUTPUT"

      - name: Fetch screenshots from deployed site
        id: fetch
        if: steps.source.outputs.source == 'fetch'
        run: |
          PAGES_BASE="${{ steps.source.outputs.pages_base }}" \
          bash scripts/fetch-doc-screenshots.sh

      - name: Fallback if too many screenshots missing
        id: fallback
        if: steps.source.outputs.source == 'fetch'
        run: |
          skipped="${{ steps.fetch.outputs.skipped }}"
          if [[ -n "$skipped" && "$skipped" -gt 10 ]]; then
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          fi

      # --- Screenshots (from source, either nightly or fetch-fallback) ----------
      - name: Install system dependencies (nightly)
        if: steps.source.outputs.source == 'build' || steps.fallback.outputs.fallback == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libssl-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            xvfb

      - name: Install Rust toolchain (nightly)
        if: steps.source.outputs.source == 'build' || steps.fallback.outputs.fallback == 'true'
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo (nightly)
        if: steps.source.outputs.source == 'build' || steps.fallback.outputs.fallback == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: occt-linux

      - name: Cache OCCT static build (nightly)
        if: steps.source.outputs.source == 'build' || steps.fallback.outputs.fallback == 'true'
        id: occt-cache
        uses: actions/cache@v5
        with:
          path: third_party/OCCT/occt-install
          key: occt-install-${{ runner.os }}-v8.0.0-${{ hashFiles('scripts/build-occt.sh') }}

      - name: Fetch solvespace submodule (nightly)
        if: steps.source.outputs.source == 'build' || steps.fallback.outputs.fallback == 'true'
        run: |
          git submodule update --init --depth 1 third_party/solvespace
          git -C third_party/solvespace submodule update --init --depth 1 extlib/eigen extlib/mimalloc

      - name: Build OCCT (nightly, cache miss only)
        if: (steps.source.outputs.source == 'build' || steps.fallback.outputs.fallback == 'true') && steps.occt-cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 third_party/OCCT
          scripts/build-occt.sh

      - name: Build bearcad (nightly)
        if: steps.source.outputs.source == 'build' || steps.fallback.outputs.fallback == 'true'
        run: cargo build --release

      - name: Generate all screenshots (nightly)
        if: steps.source.outputs.source == 'build' || steps.fallback.outputs.fallback == 'true'
        env:
          BEARCAD_SKIP_BUILD: "1"
          BEARCAD_SCREENSHOT_MODE: "full"
        run: |
          mkdir -p docs-site/static/img/screenshots
          scripts/gen-doc-screenshots.sh

      - name: Publish screenshot manifest + commit marker (nightly)
        if: steps.source.outputs.source == 'build' || steps.fallback.outputs.fallback == 'true'
        run: |
          find docs-site/static/img/screenshots -type f \
            | sed 's|^docs-site/static/img/screenshots/||' \
            | LC_ALL=C sort > docs-site/static/img/screenshots/.manifest
          printf '%s\n' "$GITHUB_SHA" > docs-site/static/img/screenshots/.screenshots-commit

      - name: Save golden screenshots cache (nightly)
        if: steps.source.outputs.source == 'build' || steps.fallback.outputs.fallback == 'true'
        uses: actions/cache/save@v5
        with:
          path: docs-site/static/img/screenshots
          key: doc-screenshots-goldens-${{ github.sha }}-${{ github.run_id }}

      # --- Web app ---------------------------------------------------------------
      - name: Download web app
        uses: actions/download-artifact@v7
        with:
          name: webapp
          path: docs-site/static/app

      # --- Build & deploy ---------------------------------------------------------
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs-site

      - name: Build website
        run: npm run build
        working-directory: docs-site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/build

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5