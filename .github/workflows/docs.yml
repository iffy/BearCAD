name: Website

# Push / docs edits: fetch (or restore) existing screenshots and deploy the site.
# Do not rebuild the app or recapture shots on every commit (#1446).
# Nightly (or workflow_dispatch with generate_screenshots): recapture, then deploy.
# Nightly no-ops when the repo SHA still matches the deployed screenshots-commit.txt.

on:
  push:
    branches: [master]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
      - "scripts/fetch-doc-screenshots.sh"
      - "scripts/pages-base.sh"
      - "scripts/fetch-web-release.sh"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      generate_screenshots:
        description: "Regenerate documentation screenshots (slow: build app + capture)"
        type: boolean
        default: false

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  # A failed or stale nightly files an issue rather than sitting unread (#1836).
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      generate: ${{ steps.plan.outputs.generate }}
      run_site: ${{ steps.plan.outputs.run_site }}
      pages_base: ${{ steps.plan.outputs.pages_base }}
      stale: ${{ steps.drift.outputs.stale }}
      behind: ${{ steps.drift.outputs.behind }}
      days: ${{ steps.drift.outputs.days }}
      reason: ${{ steps.drift.outputs.reason }}
    steps:
      # Full history: the drift check counts commits from the published marker to HEAD.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide screenshot + site work
        id: plan
        env:
          DISPATCH_GENERATE: ${{ inputs.generate_screenshots }}
        run: |
          set -euo pipefail
          pages_base="$(GITHUB_REPOSITORY="$GITHUB_REPOSITORY" bash scripts/pages-base.sh)"
          echo "pages_base=$pages_base" >> "$GITHUB_OUTPUT"

          # The SHA the deployed screenshots were captured at, for every event: a push
          # that only fetches them still gets to report how far behind they are (#1836).
          marker=""
          for url in \
            "${pages_base}img/screenshots/screenshots-commit.txt" \
            "${pages_base}img/screenshots/.screenshots-commit"
          do
            body="$(curl -fsSL --max-time 30 "$url" 2>/dev/null || true)"
            if [[ -n "$body" && "$body" != *"<html"* && "$body" != *"<!DOCTYPE"* ]]; then
              marker="$(printf '%s' "$body" | tr -d '[:space:]')"
              break
            fi
          done
          echo "marker=$marker" >> "$GITHUB_OUTPUT"

          generate=false
          run_site=true

          case "$GITHUB_EVENT_NAME" in
            schedule)
              if [[ -n "$marker" && "$marker" == "$GITHUB_SHA" ]]; then
                echo "nightly: repo unchanged since last screenshot build ($marker); skip"
                run_site=false
              else
                echo "nightly: regenerating screenshots (marker='${marker:-none}')"
                generate=true
              fi
              ;;
            workflow_dispatch)
              if [[ "$DISPATCH_GENERATE" == "true" ]]; then
                echo "workflow_dispatch: generating screenshots"
                generate=true
              else
                echo "workflow_dispatch: site build only (no screenshot generation)"
              fi
              ;;
            *)
              echo "push: fetch/cache screenshots; do not generate"
              ;;
          esac

          echo "generate=$generate" >> "$GITHUB_OUTPUT"
          echo "run_site=$run_site" >> "$GITHUB_OUTPUT"

      # How far the live screenshots lag master, and whether that is too far (#1836).
      - name: Measure screenshot drift
        id: drift
        env:
          DRIFT_MARKER: ${{ steps.plan.outputs.marker }}
        run: bash scripts/screenshot-drift.sh

      - name: Report screenshot drift
        run: |
          {
            echo "### Doc screenshots"
            echo
            echo "- captured at: \`${{ steps.plan.outputs.marker || 'never published' }}\`"
            echo "- behind master: ${{ steps.drift.outputs.behind }} commit(s), ${{ steps.drift.outputs.days }} day(s)"
            echo "- stale: ${{ steps.drift.outputs.stale }} ${{ steps.drift.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.drift.outputs.stale }}" == "true" ]]; then
            echo "::warning::doc screenshots are stale — ${{ steps.drift.outputs.reason }}"
          fi

  # The hosted web app (wasm32) deploys under /app/ next to the docs.
  webapp:
    if: needs.plan.outputs.run_site == 'true'
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download web app from latest published release
        id: fetch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-web-release.sh

      - name: Upload web app artifact (from release)
        if: steps.fetch.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: webapp
          path: web/dist/
          if-no-files-found: error

      - name: Install Rust toolchain
        if: steps.fetch.outcome == 'failure'
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        if: steps.fetch.outcome == 'failure'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-web

      - name: Install wasm-bindgen-cli
        if: steps.fetch.outcome == 'failure'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.125

      - name: Install Emscripten
        if: steps.fetch.outcome == 'failure'
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.2

      - name: Cache OCCT wasm build
        if: steps.fetch.outcome == 'failure'
        id: occt-wasm-cache
        uses: actions/cache@v5
        with:
          path: third_party/OCCT/occt-install-wasm
          key: occt-install-wasm-v8.0.0-${{ hashFiles('scripts/build-occt-wasm.sh') }}

      - name: Fetch OCCT submodule (cache miss only)
        if: steps.fetch.outcome == 'failure' && steps.occt-wasm-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 third_party/OCCT

      - name: Fetch solvespace submodule
        if: steps.fetch.outcome == 'failure'
        run: |
          git submodule update --init --depth 1 third_party/solvespace
          git -C third_party/solvespace submodule update --init --depth 1 extlib/eigen extlib/mimalloc

      - name: Build web app (fallback)
        if: steps.fetch.outcome == 'failure'
        run: scripts/build-web.sh

      - name: Upload web app artifact (fallback build)
        if: steps.fetch.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: webapp
          path: web/dist/
          if-no-files-found: error

  # generate=true: build the app and recapture every screenshot (nightly / dispatch).
  # generate=false: restore goldens + fetch from the live site; never recapture.
  build:
    if: needs.plan.outputs.run_site == 'true'
    needs: [plan, webapp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # --- Screenshots (reuse) ---------------------------------------------------
      - name: Restore golden screenshots
        if: needs.plan.outputs.generate != 'true'
        uses: actions/cache/restore@v5
        with:
          path: docs-site/static/img/screenshots
          key: doc-screenshots-goldens-${{ github.sha }}
          restore-keys: |
            doc-screenshots-goldens-

      - name: Fetch screenshots from deployed site
        if: needs.plan.outputs.generate != 'true'
        run: |
          PAGES_BASE="${{ needs.plan.outputs.pages_base }}" \
          bash scripts/fetch-doc-screenshots.sh

      # --- Screenshots (nightly / explicit generate) -----------------------------
      # Screenshots generate headless (offscreen wgpu, no X server / xvfb — #1804);
      # the software Vulkan driver is what makes the offscreen render work here.
      # The GUI -dev packages stay: the binary still links the windowed stack.
      - name: Install system dependencies (generate)
        if: needs.plan.outputs.generate == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libssl-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Rust toolchain (generate)
        if: needs.plan.outputs.generate == 'true'
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo (generate)
        if: needs.plan.outputs.generate == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: occt-linux

      - name: Cache OCCT static build (generate)
        if: needs.plan.outputs.generate == 'true'
        id: occt-cache
        uses: actions/cache@v5
        with:
          path: third_party/OCCT/occt-install
          key: occt-install-${{ runner.os }}-v8.0.0-${{ hashFiles('scripts/build-occt.sh') }}

      - name: Fetch solvespace submodule (generate)
        if: needs.plan.outputs.generate == 'true'
        run: |
          git submodule update --init --depth 1 third_party/solvespace
          git -C third_party/solvespace submodule update --init --depth 1 extlib/eigen extlib/mimalloc

      - name: Build OCCT (generate, cache miss only)
        if: needs.plan.outputs.generate == 'true' && steps.occt-cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 third_party/OCCT
          scripts/build-occt.sh

      - name: Build bearcad (generate)
        if: needs.plan.outputs.generate == 'true'
        run: cargo build --release

      - name: Generate all screenshots
        if: needs.plan.outputs.generate == 'true'
        env:
          BEARCAD_SKIP_BUILD: "1"
          BEARCAD_SCREENSHOT_MODE: "full"
        run: |
          mkdir -p docs-site/static/img/screenshots
          scripts/gen-doc-screenshots.sh

      - name: Publish screenshot manifest + commit marker
        if: needs.plan.outputs.generate == 'true'
        run: |
          out=docs-site/static/img/screenshots
          mkdir -p "$out"
          # Non-dot names: Docusaurus does not copy dotfiles from static/.
          find "$out" -type f \
            ! -name 'manifest.txt' ! -name '.manifest' \
            ! -name 'screenshots-commit.txt' ! -name '.screenshots-commit' \
            | sed "s|^$out/||" \
            | LC_ALL=C sort > "$out/manifest.txt"
          printf '%s\n' "$GITHUB_SHA" > "$out/screenshots-commit.txt"
          rm -f "$out/.manifest" "$out/.screenshots-commit"

      - name: Save golden screenshots cache
        if: needs.plan.outputs.generate == 'true'
        uses: actions/cache/save@v5
        with:
          path: docs-site/static/img/screenshots
          key: doc-screenshots-goldens-${{ github.sha }}-${{ github.run_id }}

      # --- Web app ---------------------------------------------------------------
      - name: Download web app
        uses: actions/download-artifact@v7
        with:
          name: webapp
          path: docs-site/static/app

      # --- Build & deploy ---------------------------------------------------------
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs-site

      # Screenshots the docs reference but nobody captures fail the build; ones a
      # capture script owns only warn, unless this run just generated them (#1837).
      - name: Build website
        run: npm run build
        working-directory: docs-site
        env:
          BEARCAD_DOCS_REQUIRE_SCREENSHOTS: ${{ needs.plan.outputs.generate }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/build

  deploy:
    if: |
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # #1836: a red scheduled run used to sit unread in the Actions tab while the published
  # screenshots froze. Say it in the one place that reaches a person: an issue.
  alert:
    # Stale screenshots are only an alarm if this run did not fix them: a nightly that
    # regenerates and deploys them has already dealt with the drift the plan job measured
    # (#1951 — it fired on every nightly that had any new commits).
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || (needs.plan.outputs.stale == 'true' && needs.plan.outputs.generate != 'true'))
    needs: [plan, webapp, build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update the nightly screenshot alarm
        env:
          GH_TOKEN: ${{ github.token }}
          # This job checks nothing out, so `gh` has no git remote to infer the repo from
          # and every call failed with "not a git repository" (#1951).
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          STALE: ${{ needs.plan.outputs.stale }}
          BEHIND: ${{ needs.plan.outputs.behind }}
          DAYS: ${{ needs.plan.outputs.days }}
          REASON: ${{ needs.plan.outputs.reason }}
        run: |
          set -euo pipefail
          title="Nightly doc screenshots are not being published"
          body="$(
            printf 'The scheduled **Website** run needs attention.\n\n'
            printf -- '- failed jobs: %s\n' "$FAILED"
            printf -- '- screenshots stale: %s %s\n' "$STALE" "$REASON"
            printf -- '- behind master: %s commit(s), %s day(s)\n' "$BEHIND" "$DAYS"
            printf -- '- run: %s\n' "$RUN_URL"
          )"
          existing="$(gh issue list --state open --search "$title in:title" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number")"
          if [[ -n "$existing" && "$existing" != "null" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
