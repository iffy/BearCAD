name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings

jobs:
  # The Linux test job (todoer #470): builds BearCAD with the statically-linked
  # OpenCASCADE kernel (#86/#89) — the shipping configuration — and runs the full
  # test suite, launch smoke, example scripts, and interaction tests against it.
  # The OCCT build is expensive, so it's cached on the pinned submodule +
  # build-script hash — after the first cold run it's restored, not rebuilt. The
  # macOS OCCT path (-dead_strip) is exercised by the macOS release build.
  occt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Submodules are fetched only on an OCCT cache miss (below), to avoid the
        # large OCCT clone on every run.
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: occt-linux

      # Time-boxed with retries: `apt-get update` is known to stall on the hosted
      # runners (DNS/network flake), and an unbounded hang eats the whole 6h workflow
      # budget and aborts the run. A bounded step retries and moves on instead.
      - name: Install system dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update && timeout 600 sudo apt-get install -y \
              build-essential \
              cmake \
              libx11-dev \
              libxcb-render0-dev \
              libxcb-shape0-dev \
              libxcb-xfixes0-dev \
              libxkbcommon-dev \
              libxkbcommon-x11-0 \
              libwayland-dev \
              libssl-dev \
              libvulkan-dev \
              mesa-vulkan-drivers \
              libgtk-3-dev \
              libwebkit2gtk-4.1-dev \
              xvfb; then
              break
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 10
          done

      - name: Cache OCCT static build
        id: occt-cache
        uses: actions/cache@v5
        with:
          # build.rs resolves OCCT from this prefix by default (or $OCCT_DIR).
          path: third_party/OCCT/occt-install
          # Bump the version segment when the OCCT submodule commit changes.
          key: occt-install-${{ runner.os }}-v8.0.0-${{ hashFiles('scripts/build-occt.sh') }}

      - name: Fetch solvespace submodule (libslvs sketch solver)
        run: |
          git submodule update --init --depth 1 third_party/solvespace
          git -C third_party/solvespace submodule update --init --depth 1 extlib/eigen extlib/mimalloc

      - name: Build OCCT (cache miss only)
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 third_party/OCCT
          scripts/build-occt.sh

      - name: cargo test (occt)
        run: cargo test

      - name: cargo build (occt)
        run: cargo build

      - name: Launch smoke test (occt)
        run: |
          set +e
          timeout 15 xvfb-run -a ./target/debug/bearcad --exit --timeout 10
          code=$?
          set -e
          if [[ $code -eq 0 || $code -eq 124 ]]; then
            echo "occt build launched successfully (exit code $code)."
          else
            echo "occt build failed to launch (exit code $code)." >&2
            exit "$code"
          fi

      - name: Run example scripts
        run: |
          shopt -s nullglob
          scripts=(examples/*.lua)
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "No example Lua scripts found in examples/" >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "Running $script"
            # --timeout force-exits (code 1) if the app hasn't finished on its own —
            # a hung script (e.g. headless GPU/EGL issues under Xvfb) must fail the
            # job instead of hanging it indefinitely.
            xvfb-run -a ./target/debug/bearcad --script "$script" --exit --timeout 30
          done

      # Interaction regression tests (todoer #459): scripted *real* pointer input
      # (raw-input synthetic events) driving click-select and drags end to end.
      # A lua assert failure exits non-zero (#125) and fails the job.
      - name: Run interaction tests
        env:
          # Fixed large window so ground-coordinate clicks land in the 3D viewport
          # under Xvfb (no window manager to honor maximize). See BEARCAD_WINDOW.
          BEARCAD_WINDOW: 1280x800
          # The app loads AI config at startup; point it at a throwaway file so a test run
          # never touches the ai.json of the machine running it.
          BEARCAD_AI_CONFIG: ${{ runner.temp }}/bearcad-ai.json
        run: |
          shopt -s nullglob
          tests=(tests/interaction/*.lua)
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "No interaction tests found in tests/interaction/" >&2
            exit 1
          fi
          failed=0
          for script in "${tests[@]}"; do
            echo "::group::Running $script"
            # 120s: body outline highlight (#1110) + llvmpipe makes multi-wait Face Snap
            # scripts (hover midpoints, staged picks) exceed the old 60s budget.
            if xvfb-run -a ./target/debug/bearcad --script "$script" --exit --timeout 120; then
              echo "OK $script"
            else
              echo "::error::FAILED $script (exit $?)"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  # Windows/MSVC static-OCCT kernel build + tests (#96, proven; todoer #468): the
  # same configuration the Windows release ships, so kernel regressions on
  # Windows are caught on every push/PR like the Linux `occt` job does.
  windows-occt:
    runs-on: windows-latest
    steps:
      - name: Checkout
        # Submodules are fetched only on an OCCT cache miss (below), to avoid the
        # large OCCT clone on every run.
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: occt-windows

      - name: Cache OCCT static build
        id: occt-cache
        uses: actions/cache@v5
        with:
          # build.rs resolves OCCT from this prefix by default (or $OCCT_DIR).
          path: third_party/OCCT/occt-install
          # Bump the version segment when the OCCT submodule commit changes.
          key: occt-install-${{ runner.os }}-v8.0.0-${{ hashFiles('scripts/build-occt.ps1') }}

      - name: Fetch solvespace submodule (libslvs sketch solver)
        run: |
          git submodule update --init --depth 1 third_party/solvespace
          git -C third_party/solvespace submodule update --init --depth 1 extlib/eigen extlib/mimalloc

      - name: Build OCCT (cache miss only)
        if: steps.occt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git submodule update --init --depth 1 third_party/OCCT
          pwsh scripts/build-occt.ps1

      # On Windows the default feature set already includes `occt`; the explicit
      # flag keeps this job self-describing.
      - name: cargo build (occt)
        run: cargo build

      - name: cargo test (occt)
        run: cargo test

  # Shared release identity for this workflow run (#1129): one YYMMDD-### build
  # number so every matrix platform bakes the same tag the publish step will create.
  release-id:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.id.outputs.version }}
      build_number: ${{ steps.id.outputs.build_number }}
      tag: ${{ steps.id.outputs.tag }}
      release_name: ${{ steps.id.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nim
        uses: iffy/install-nim@v5
        with:
          version: binary:stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install changer
        run: nimble install changer@0.9.1 -y

      - name: Compute release identity
        id: id
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          version="$(bash scripts/release-changelog.sh next-version | tr -d '[:space:]')"
          mkdir -p dist-release
          bash scripts/release-changelog.sh notes > dist-release/notes.md
          bash scripts/release-changelog.sh full dist-release/changelog.md
          build_number="$(bash scripts/next-build-number.sh --from-github)"
          tag="v${version}-build.${build_number}"
          {
            echo "version=${version}"
            echo "build_number=${build_number}"
            echo "tag=${tag}"
            echo "release_name=v${version} build ${build_number}"
          } >> "$GITHUB_OUTPUT"
          echo "Release identity: ${tag}"

      - name: Upload changelog for release builds
        uses: actions/upload-artifact@v6
        with:
          name: release-meta
          path: dist-release/

  build-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [occt, windows-occt, release-id]
    strategy:
      fail-fast: false
      matrix:
        # Every platform ships the OCCT kernel (todoer #468); `occt_script` is the
        # per-OS static-OCCT build script, hashed into the cache key so each
        # platform shares its cache with the corresponding test job.
        include:
          - runner: ubuntu-latest
            os_slug: linux-x86_64
            artifact: bearcad-linux-x86_64.tar.gz
            kernel: true
            occt_script: scripts/build-occt.sh
            occt_build: bash scripts/build-occt.sh
            cargo_flags: ""
          - runner: macos-latest
            os_slug: macos-aarch64
            artifact: bearcad.dmg
            kernel: true
            occt_script: scripts/build-occt.sh
            occt_build: bash scripts/build-occt.sh
            cargo_flags: ""
          - runner: windows-latest
            os_slug: windows-x86_64
            artifact: bearcad.exe
            kernel: true
            occt_script: scripts/build-occt.ps1
            occt_build: pwsh scripts/build-occt.ps1
            cargo_flags: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: release-${{ matrix.os_slug }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # Time-boxed with retries: `apt-get update` is known to stall on the hosted
        # runners (DNS/network flake), and an unbounded hang eats the whole 6h
        # workflow budget and aborts the run (same hardening as the `occt` job).
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update && timeout 600 sudo apt-get install -y \
              build-essential \
              cmake \
              libx11-dev \
              libxcb-render0-dev \
              libxcb-shape0-dev \
              libxcb-xfixes0-dev \
              libxkbcommon-dev \
              libxkbcommon-x11-0 \
              libwayland-dev \
              libssl-dev \
              libvulkan-dev \
              mesa-vulkan-drivers \
              libgtk-3-dev \
              libwebkit2gtk-4.1-dev; then
              break
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 10
          done

      # OCCT kernel, cached on the pinned submodule + per-OS build script,
      # matching the `occt`/`windows-occt` CI jobs' keys so each platform reuses
      # the same build.
      - name: Cache OCCT static build
        if: matrix.kernel
        id: occt-cache
        uses: actions/cache@v5
        with:
          path: third_party/OCCT/occt-install
          key: occt-install-${{ runner.os }}-v8.0.0-${{ hashFiles(matrix.occt_script) }}

      - name: Fetch solvespace submodule (libslvs sketch solver)
        run: |
          git submodule update --init --depth 1 third_party/solvespace
          git -C third_party/solvespace submodule update --init --depth 1 extlib/eigen extlib/mimalloc

      - name: Build OCCT (cache miss only)
        if: matrix.kernel && steps.occt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git submodule update --init --depth 1 third_party/OCCT
          ${{ matrix.occt_build }}

      # Bake the exact release tag into the binary (todoer #466, #1129): the `release`
      # job tags v{version}-build.YYMMDD-### *after* this build, and the shallow checkout
      # has no tags for `git describe` — without this the shipped binary only knows its
      # crate version and the update badge offers the very build being run.
      # Changelog (#1328): the full changer-bump preview produced by release-id.
      - name: Download changelog
        uses: actions/download-artifact@v7
        with:
          name: release-meta
          path: release-meta

      - name: Bake release identity
        shell: bash
        run: |
          echo "BEARCAD_RELEASE_TAG=${{ needs.release-id.outputs.tag }}" >> "$GITHUB_ENV"
          echo "BEARCAD_CHANGELOG_PATH=${GITHUB_WORKSPACE}/release-meta/changelog.md" >> "$GITHUB_ENV"

      # Every platform builds the default feature set (kernel included).
      - name: cargo build --release
        run: cargo build --release ${{ matrix.cargo_flags }}

      - name: Package Linux release
        if: matrix.os_slug == 'linux-x86_64'
        run: bash scripts/package-release.sh linux

      - name: Import Apple signing certificates
        if: matrix.os_slug == 'macos-aarch64'
        env:
          BEARCAD_REQUIRE_SIGN: "1"
          APPLE_DEVELOPER_ID_APPLICATION_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12 }}
          APPLE_DEVELOPER_ID_APPLICATION_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_PASSWORD }}
          APPLE_DEVELOPER_ID_INSTALLER_P12: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12 }}
          APPLE_DEVELOPER_ID_INSTALLER_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_PASSWORD }}
        run: bash scripts/sign-macos.sh import-keychain

      - name: Package macOS release
        if: matrix.os_slug == 'macos-aarch64'
        env:
          BEARCAD_REQUIRE_SIGN: "1"
          BEARCAD_REQUIRE_NOTARIZE: "1"
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash scripts/package-release.sh macos

      - name: Delete signing keychain
        if: always() && matrix.os_slug == 'macos-aarch64'
        run: bash scripts/sign-macos.sh delete-keychain

      - name: Package Windows release
        if: matrix.os_slug == 'windows-x86_64'
        shell: pwsh
        run: pwsh scripts/package-windows.ps1

      # Windows code signing (Azure Trusted Signing): an unsigned .exe trips
      # SmartScreen's "unknown publisher" block on download. Only the service
      # principal is secret -- the endpoint/account/profile name the same Azure
      # resources Buckets signs with, and are checked in there too.
      - name: Check Windows signing credentials
        if: matrix.os_slug == 'windows-x86_64'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $missing = @(
            'AZURE_TENANT_ID',
            'AZURE_CLIENT_ID',
            'AZURE_CLIENT_SECRET'
          ) | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            throw "Missing Windows signing secrets: $($missing -join ', ')"
          }
          Write-Host "Windows signing credentials present."

      # Signs the packaged root-level bearcad.exe -- the exact file the release
      # job uploads -- rather than the target\release copy. Every credential
      # source but the environment (the secrets above) is excluded, so a hosted
      # runner's ambient identity can't be tried first and stall the sign.
      - name: Sign Windows release
        if: matrix.os_slug == 'windows-x86_64'
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          signing-account-name: com-onepartrain
          certificate-profile-name: com-onepartrain
          files: ${{ github.workspace }}\bearcad.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-managed-identity-credential: true
          exclude-workload-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      # Gate the upload on a real Authenticode check: a signing step that
      # silently no-ops would otherwise ship an unsigned binary.
      - name: Verify Windows signature
        if: matrix.os_slug == 'windows-x86_64'
        shell: pwsh
        env:
          BEARCAD_REQUIRE_SIGN: "1"
        run: pwsh scripts/verify-windows-signature.ps1 bearcad.exe

      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: bearcad-${{ matrix.os_slug }}
          path: ${{ matrix.artifact }}

  # Build the WASM web app once so the website CI can pull it from the published
  # release instead of rebuilding it on every docs push (#1387). Built alongside the
  # desktop binaries and attached to the same draft release, so "latest published
  # (non-draft) release" always carries a matching web app.
  # Bake the same release identity as the desktop jobs (#1546): without
  # BEARCAD_RELEASE_TAG the wasm About dialog falls back to the crate version.
  build-web-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [release-id]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-web

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.125

      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          # Match the locally-verified toolchain (the kernel build was validated on 6.0.2).
          version: 6.0.2

      - name: Cache OCCT wasm build
        id: occt-wasm-cache
        uses: actions/cache@v5
        with:
          path: third_party/OCCT/occt-install-wasm
          key: occt-install-wasm-v8.0.0-${{ hashFiles('scripts/build-occt-wasm.sh') }}

      - name: Fetch OCCT submodule (cache miss only)
        if: steps.occt-wasm-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --depth 1 third_party/OCCT

      # libslvs is compiled into the kernel module on every run (unlike the OCCT static
      # libs, it isn't cached), so its sources are always needed.
      - name: Fetch solvespace submodule (libslvs sketch solver)
        run: |
          git submodule update --init --depth 1 third_party/solvespace
          git -C third_party/solvespace submodule update --init --depth 1 extlib/eigen extlib/mimalloc

      # Same bake as the desktop release jobs (#466, #1129, #1546): the `release`
      # job tags v{version}-build.YYMMDD-### *after* this build, and the shallow
      # checkout has no tags for `git describe`.
      - name: Download changelog
        uses: actions/download-artifact@v7
        with:
          name: release-meta
          path: release-meta

      - name: Bake release identity
        shell: bash
        run: |
          echo "BEARCAD_RELEASE_TAG=${{ needs.release-id.outputs.tag }}" >> "$GITHUB_ENV"
          echo "BEARCAD_CHANGELOG_PATH=${GITHUB_WORKSPACE}/release-meta/changelog.md" >> "$GITHUB_ENV"

      - name: Build web app (kernel + app)
        run: scripts/build-web.sh

      - name: Package web app (bearcad-web.zip)
        run: bash scripts/package-web.sh

      - name: Upload web app release asset
        uses: actions/upload-artifact@v6
        with:
          name: bearcad-web
          path: web/bearcad-web.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build-release, build-web-release, release-id]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          # Version is changer bump's next version; build number is YYMMDD-### (#1328, #1129).
          tag_name: ${{ needs.release-id.outputs.tag }}
          name: ${{ needs.release-id.outputs.release_name }}
          draft: true
          prerelease: false
          generate_release_notes: false
          body_path: artifacts/notes.md
          files: |
            artifacts/bearcad-linux-x86_64.tar.gz
            artifacts/bearcad.dmg
            artifacts/bearcad.exe
            artifacts/bearcad-web.zip

      - name: Prune old draft releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-draft-releases.sh 2