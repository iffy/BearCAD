<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1b1f" />
  <meta name="description" content="BearCAD — local-first, parametric CAD. Installable on Chromebooks." />
  <title>BearCAD</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #1b1b1f;
      /* The app handles all touch gestures itself: no browser pinch-zoom, pan,
         pull-to-refresh, double-tap zoom, or long-press selection. */
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #cfcfd4;
      font: 15px/1.4 system-ui, sans-serif;
      text-align: center;
      padding: 0 24px;
    }
    #loading .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(207, 207, 212, 0.18);
      border-top-color: #cfcfd4;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    #loading .bar {
      display: none;
      width: min(220px, 60vw);
      height: 3px;
      background: rgba(207, 207, 212, 0.15);
      border-radius: 999px;
      overflow: hidden;
    }
    #loading .bar-fill {
      height: 100%;
      width: 0;
      background: #cfcfd4;
      border-radius: inherit;
    }
    #loading.determinate .spinner { display: none; }
    #loading.determinate .bar { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div><strong>BearCAD</strong> is loading…</div>
    <div class="spinner" aria-hidden="true"></div>
    <div class="bar" aria-hidden="true"><div class="bar-fill" id="bar-fill"></div></div>
  </div>
  <canvas id="bearcad_canvas"></canvas>
  <script>
    // iOS Safari implements pinch page-zoom through its proprietary gesture events
    // and ignores user-scalable=no; swallowing these keeps the pinch for the app.
    for (const type of ["gesturestart", "gesturechange", "gestureend"]) {
      document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
    }
    // Double-tap zoom, likewise.
    document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });
    // Right-drag orbits and Shift+right-drag pans. The browser's native context
    // menu steals the pointer (and eframe's canvas handler can miss the event
    // while locked inside pointerdown), so cancel it here in capture phase (#1447).
    document.addEventListener("contextmenu", (e) => e.preventDefault(), { capture: true, passive: false });
    // Chrome / ChromeOS installability: a controlling service worker is required.
    // Scope is this directory (/app/ when hosted), so the SW stays under the app root.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch((err) => {
        console.warn("BearCAD: service worker registration failed:", err);
      });
    }
  </script>
  <script type="module">
    // Every asset carries the build it belongs to. wasm-bindgen mangles each imported JS
    // function's name with a content hash, so a cached bearcad.js paired with a freshly
    // fetched bearcad_bg.wasm (or the reverse) fails instantiation outright with
    // "LinkError: import object field '__wbg_...' is not a Function". Without a version in
    // the URL the browser is free to expire the two independently and produce exactly that
    // (#1049). scripts/build-web.sh substitutes the stamp; unsubstituted it is harmless.
    const BUILD = "__BEARCAD_BUILD__";
    const v = (path) => BUILD.startsWith("__") ? path : path + "?v=" + BUILD;

    // Byte progress is only shown when XHR reports lengthComputable (Content-Length).
    // Otherwise the CSS spinner stays up. Wasm is fetched up front so the three
    // modules can share one bar, then handed to Emscripten / wasm-bindgen.
    const loading = document.getElementById("loading");
    const barFill = document.getElementById("bar-fill");
    const progress = { need: 0, known: 0, loaded: 0, total: 0 };
    function paintProgress() {
      if (!loading || !barFill || progress.known < progress.need || progress.total <= 0) return;
      loading.classList.add("determinate");
      barFill.style.width = Math.min(100, (100 * progress.loaded) / progress.total) + "%";
    }
    function getBuffer(url) {
      progress.need += 1;
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        let tracked = false;
        let got = 0;
        xhr.open("GET", url);
        xhr.responseType = "arraybuffer";
        xhr.onprogress = (e) => {
          if (!e.lengthComputable) return;
          if (!tracked) {
            tracked = true;
            progress.known += 1;
            progress.total += e.total;
          }
          progress.loaded += e.loaded - got;
          got = e.loaded;
          paintProgress();
        };
        xhr.onload = () => {
          if (xhr.status < 200 || xhr.status >= 300) {
            reject(new Error(url + ": " + xhr.status));
            return;
          }
          const buf = xhr.response;
          if (!tracked) {
            progress.known += 1;
            progress.total += buf.byteLength;
            progress.loaded += buf.byteLength;
            paintProgress();
          }
          resolve(buf);
        };
        xhr.onerror = () => reject(new Error("failed to load " + url));
        xhr.send();
      });
    }
    function emscriptenFrom(buffer) {
      let rejectInst;
      const instFailed = new Promise((_, reject) => { rejectInst = reject; });
      const opts = {
        locateFile: (p) => v(p),
        instantiateWasm(info, receive) {
          WebAssembly.instantiate(buffer, info).then(
            (out) => receive(out.instance, out.module),
            rejectInst,
          );
          return {};
        },
      };
      return { opts, instFailed };
    }

    const kernelWasm = getBuffer(v("./kernel.wasm"));
    const luaWasm = getBuffer(v("./lua.wasm"));
    const appWasm = getBuffer(v("./bearcad_bg.wasm"));

    // The OCCT geometry kernel is a second wasm module (Emscripten); load it first so
    // the app's kernel bridge finds it. If it fails, the app still runs — with the
    // lean-build fallbacks (no solid cuts) and a status note in Help > About.
    try {
      const [{ default: BearcadKernel }, wasm] = await Promise.all([
        import(v("./kernel.js")),
        kernelWasm,
      ]);
      const { opts, instFailed } = emscriptenFrom(wasm);
      globalThis.bearcadKernel = await Promise.race([BearcadKernel(opts), instFailed]);
    } catch (err) {
      console.warn("BearCAD: geometry kernel failed to load; running lean:", err);
    }
    // The Lua interpreter is a third wasm module (Emscripten); load it so File → Load
    // Script can run .lua files. If it fails, the app still runs — scripting is just
    // unavailable, reported when you try to load a script.
    try {
      const [{ default: BearcadLua }, wasm] = await Promise.all([
        import(v("./lua.js")),
        luaWasm,
      ]);
      const { opts, instFailed } = emscriptenFrom(wasm);
      globalThis.bearcadLua = await Promise.race([BearcadLua(opts), instFailed]);
    } catch (err) {
      console.warn("BearCAD: Lua interpreter failed to load; scripting disabled:", err);
    }
    let init;
    let wasm;
    try {
      [{ default: init }, wasm] = await Promise.all([
        import(v("./bearcad.js")),
        appWasm,
      ]);
    } catch (err) {
      const el = document.getElementById("loading");
      if (el) {
        el.innerHTML =
          "<div><strong>BearCAD couldn't start.</strong></div>" +
          "<div>" + String(err) + "</div>";
      }
      throw err;
    }
    // Prefetched bytes stay paired with this build's stamped JS (#1049).
    init({ module_or_path: wasm })
      .then(() => document.getElementById("loading")?.remove())
      .catch((err) => {
        const el = document.getElementById("loading");
        // eframe throws a benign "Using exceptions for control flow" on startup in
        // some builds; anything else is a real failure worth showing.
        if (el && !String(err).includes("control flow")) {
          const text = String(err);
          // A LinkError is a mismatched pair of cached assets, not a missing GPU — saying
          // "you need WebGPU" there sends people to check the one thing that is fine.
          const advice = text.includes("LinkError")
            ? "This build's files don't match — a stale copy is cached. A hard reload " +
              "(Shift-Reload) should fix it."
            : "A browser with WebGPU or WebGL2 is required.";
          el.innerHTML =
            "<div><strong>BearCAD couldn't start.</strong></div>" +
            "<div>" + text + "</div>" +
            "<div>" + advice + "</div>";
        } else {
          el?.remove();
        }
      });
  </script>
</body>
</html>
